<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mem — the tome</title>
<style>
  :root{ --ink:#1A1714; --brass:#A8641F; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#14100D;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

  /* a stage, not a page: the book sits on a surface with one warm light above it */
  .stage{position:relative;width:390px;height:844px;overflow:hidden;border-radius:44px;
    background:
      radial-gradient(70% 45% at 32% 18%, rgba(255,214,160,.16), transparent 62%),
      radial-gradient(120% 90% at 50% 40%, #2A211A 0%, #171310 62%, #0C0A08 100%);
    display:flex;align-items:center;justify-content:center;perspective:1600px;
    box-shadow:0 30px 80px rgba(0,0,0,.55)}
  .stage:after{ /* table grain, very low contrast */
    content:"";position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay;
    background-image:repeating-linear-gradient(92deg, rgba(255,240,215,.16) 0 1px, transparent 1px 7px);
  }
  .book{position:relative;width:252px;height:336px;transform-style:preserve-3d;
    transform:rotateX(16deg) rotateY(-9deg) rotateZ(-1deg);animation:settle 1.6s ease-out both}

  /* the page block: leaves you can see the edges of */
  .block{position:absolute;left:4px;right:-4px;top:4px;bottom:-4px;border-radius:3px 7px 7px 3px;
    background-image:url(art/pages-warm.png);background-size:100% 100%;background-position:left center;
    filter:brightness(.92) saturate(.95);
    box-shadow:10px 14px 28px rgba(0,0,0,.6), inset -3px 0 8px rgba(70,46,24,.35)}
  .block:after{content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(90deg, rgba(0,0,0,.35), transparent 18%, transparent 88%, rgba(0,0,0,.22))}

  /* the open page, revealed as the cover swings */
  .page{position:absolute;left:6px;right:-7px;top:5px;bottom:-6px;border-radius:3px 8px 8px 3px;
    background:linear-gradient(100deg,#F3EAD8,#FFFDF6 26%,#FBF4E6 78%,#EFE3CE);padding:44px 26px 30px 34px;
    box-shadow:inset 0 0 60px rgba(150,120,80,.18)}
  .page .head{animation:ink 1.4s ease-out 1.35s both}
  .page .chapter{font-family:Georgia,serif;font-size:19px;letter-spacing:.02em;color:#2A2A26;margin-bottom:10px}
  .page .rule{height:1px;background:#DCCDB2;margin:10px 0 12px}
  .page p{font-family:Georgia,serif;font-size:11.5px;line-height:1.75;color:#4A4034;margin:0 0 9px}
  .page p.dim{color:#7A6B57}
  .page .folio{position:absolute;bottom:16px;left:0;right:22px;text-align:center;font-family:Georgia,serif;
    font-size:10px;color:#9A8A72}
  @keyframes ink{from{opacity:0}to{opacity:1}}
  .page .l{height:9px;border-radius:5px;background:#2B241E;opacity:.2;margin-bottom:13px;transform:scaleX(0);
    transform-origin:left center;animation:write .7s ease-out forwards}
  .page .t{height:17px;width:58%;opacity:.62;background:#22352D;animation-delay:1.45s}
  .page .a{width:90%;animation-delay:1.6s}.page .b{width:84%;animation-delay:1.72s}.page .c{width:62%;animation-delay:1.84s}
  .page .sig{font-family:Georgia,serif;font-style:italic;font-size:13.5px;color:#8A7A63;opacity:0;
    animation:fade .8s ease-out 2.1s forwards}
  .page .gutter{position:absolute;left:0;top:0;bottom:0;width:34px;
    background:linear-gradient(90deg, rgba(90,64,36,.30), rgba(90,64,36,.05) 60%, transparent)}

  /* the cover, pivoting on the spine */
  .cover{position:absolute;left:0;top:0;width:252px;height:336px;transform-origin:left center;
    transform-style:preserve-3d;animation:open 1.15s cubic-bezier(.2,.75,.15,1) .5s forwards}
  .cover .front,.cover .inside{position:absolute;inset:0;border-radius:3px 9px 9px 3px;
    backface-visibility:hidden;transform:translateZ(2px)}
  .cover .front{background-image:url(art/cover-front.png);background-size:cover;
    box-shadow:0 22px 40px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,220,170,.06)}
  .cover .front:after{ /* the light falls across it, not behind it */
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(128deg, rgba(255,226,180,.16) 0%, rgba(255,226,180,.04) 26%, rgba(0,0,0,.18) 72%, rgba(0,0,0,.34) 100%)}
  .cover .inside{transform:rotateY(180deg) translateZ(2px);
    background-image:url(art/endpaper.png);background-size:cover;
    filter:sepia(.35) brightness(.72) saturate(.8);
    box-shadow:inset -30px 0 50px rgba(40,26,14,.55), inset 0 0 0 1px rgba(60,40,22,.5)}

  .caption{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(232,213,182,.55)}
  .shadow{position:absolute;left:50%;bottom:196px;width:280px;height:30px;transform:translateX(-46%);
    background:radial-gradient(closest-side, rgba(0,0,0,.72), rgba(0,0,0,.22) 55%, transparent 78%);filter:blur(9px)}

  @keyframes settle{from{transform:rotateX(20deg) rotateY(-13deg) rotateZ(-2deg) translateY(10px)}
                    to{transform:rotateX(16deg) rotateY(-9deg) rotateZ(-1deg)}}
  @keyframes open{0%{transform:rotateY(0)}100%{transform:rotateY(-156deg)}}
  @keyframes write{to{transform:scaleX(1)}}
  @keyframes fade{to{opacity:1}}
  @media (prefers-reduced-motion: reduce){
    .cover{animation:none;transform:rotateY(-156deg)}
    .page .l{animation:none;transform:scaleX(1)} .page .sig{animation:none;opacity:1}
  }
  .again{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);border:1px solid rgba(200,170,130,.45);
    background:rgba(30,24,18,.9);color:#D9C6A8;border-radius:999px;padding:8px 14px;font:inherit;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="shadow"></div>
  <div class="book">
    <div class="block"></div>
    <div class="page">
      <div class="head">
        <div class="chapter">Chapter One</div>
        <div class="rule"></div>
        <p>I was born in Chicago, in a suburb called Downers Grove, in a house with a
        two-door garage and an apple tree at the side of it.</p>
        <p class="dim">My mother always said the tree was there before the house was.</p>
        <p class="sig">and that is where the story starts.</p>
        <div class="folio">1</div>
      </div>
      <div class="gutter"></div>
    </div>
    <div class="cover">
      <div class="front"></div>
      <div class="inside"></div>
    </div>
  </div>
  <div class="caption">the first page is blank until you speak</div>
</div>
<button class="again" onclick="replay()">play again</button>
<script>
function replay(){
  const s=document.getElementById('stage'); const c=s.cloneNode(true);
  s.parentNode.replaceChild(c,s);
}
</script>
</body>
</html>
